name: Windows eager and serial installer diagnostics

on:
  workflow_dispatch:
  push:
    branches: [loongsuite-pilot-rust]
    paths: [.github/workflows/windows-native-contracts.yml]

permissions:
  contents: read

concurrency:
  group: windows-native-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  native:
    name: Eager and serial installer (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust 1.99.1 for the native runner
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-release-v1
          key: ${{ matrix.target }}-opensource
          cache-on-failure: true
      - name: Isolate test HOME while preserving the build toolchain
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Require actual PS5.1 and PS7 bootstrap in both language modes
        run: python scripts/testing/windows-bootstrap-contracts.py --timeout-seconds 20
      - name: Compile the original native installer contract
        id: compile
        run: |
          set -euo pipefail
          cargo test --locked -p loongsuite-pilot --test installer_native --no-run 2>&1 | tee "$RUNNER_TEMP/pilot-postinstall-compile.log"
      - name: Repeat the unchanged exact eager contract
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pilot-eager-baseline.log"
          pilot_case=installer_asset_tree_history::actual_eager_entry_installs_resources_and_prepared_child_does_not_wait_for_parent_locks
          cargo test --locked -p loongsuite-pilot --test installer_native "$pilot_case" -- --exact --list --color never --test-threads=1 2>&1 | tee "$log"
          python -c 'import pathlib,sys; cases=[line for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.endswith(": test")]; assert cases==[sys.argv[2]+": test"], cases' "$log" "$pilot_case"
          failures=0
          for attempt in 1 2 3; do
            printf '\nattempt=%s\n' "$attempt" | tee -a "$log"
            set +e
            cargo test --locked -p loongsuite-pilot --test installer_native "$pilot_case" -- --exact --nocapture --test-threads=1 2>&1 | tee -a "$log"
            pilot_exit=$?
            set -e
            printf 'attempt_exit=%s\n' "$pilot_exit" | tee -a "$log"
            if [ "$pilot_exit" -ne 0 ]; then failures=1; fi
          done
          exit "$failures"
      - name: Save original eager baseline logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eager-baseline-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pilot-postinstall-compile.log
            ${{ runner.temp }}/pilot-eager-baseline.log
          retention-days: 3
          if-no-files-found: warn
      - name: Complete original installer suite in one test thread
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pilot-installer-serial.log"
          set +e
          cargo test --no-fail-fast --locked -p loongsuite-pilot --test installer_native -- --nocapture --test-threads=1 --skip uninstall_default_url_and_explicit_candidates_use_the_whole_public_powershell_entry_in_both_shells_and_clm 2>&1 | tee "$log"
          pilot_exit=$?
          set -e
          printf 'pipeline_exit=%s\n' "$pilot_exit" | tee -a "$log"
          exit "$pilot_exit"
      - name: Save complete serial installer suite log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-serial-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/pilot-installer-serial.log
          retention-days: 3
          if-no-files-found: warn
