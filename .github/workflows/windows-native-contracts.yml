name: Windows Native Contracts

on:
  workflow_dispatch:
  push:
    branches: [loongsuite-pilot-rust]
    paths: [.github/workflows/windows-native-contracts.yml]

permissions:
  contents: read

concurrency:
  group: windows-native-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  native:
    name: Native contracts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.99.1 for the native runner
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-release-v1
          key: ${{ matrix.target }}-opensource
          cache-on-failure: true
      - name: Isolate test HOME while preserving the build toolchain
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Compile original two real Windows regressions
        run: |
          set -euo pipefail
          git show e15900948906f5116be301c409b5a62bba98509d:tests/codex_subagent_lifecycle.rs > tests/codex_subagent_lifecycle.rs
          cargo test --locked -p loongsuite-pilot --test codex_subagent_lifecycle --no-run
      - name: Original two cases with original budgets
        continue-on-error: true
        run: |
          set -uo pipefail
          failures=0
          for round in 1 2 3; do
            for leaf in native_codex_parallel_agent_id_only_work_has_independent_identity_and_exact_tokens native_codex_parent_finishes_before_background_child_and_invocation_spans_child_turns; do
              printf 'original round=%s leaf=%s\n' "$round" "$leaf" | tee -a "$RUNNER_TEMP/codex-original.log"
              cargo test --locked -p loongsuite-pilot --test codex_subagent_lifecycle "$leaf" -- --exact --test-threads=1 --nocapture 2>&1 | tee -a "$RUNNER_TEMP/codex-original.log" || failures=1
            done
          done
          test "$failures" -eq 0
      - name: Canonical native root candidate with original assertions
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          git show HEAD:tests/codex_subagent_lifecycle.rs > tests/codex_subagent_lifecycle.rs
          cargo test --locked -p loongsuite-pilot --test codex_subagent_lifecycle --no-run || exit $?
          failures=0
          for leaf in native_codex_parallel_agent_id_only_work_has_independent_identity_and_exact_tokens native_codex_parent_finishes_before_background_child_and_invocation_spans_child_turns; do
            cargo test --locked -p loongsuite-pilot --test codex_subagent_lifecycle "$leaf" -- --exact --test-threads=1 --nocapture 2>&1 | tee -a "$RUNNER_TEMP/codex-canonical-root.log" || failures=1
          done
          test "$failures" -eq 0
      - name: Save exact baseline and clock-control evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-two-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-original.log
            ${{ runner.temp }}/codex-canonical-root.log
          retention-days: 3
          if-no-files-found: error
