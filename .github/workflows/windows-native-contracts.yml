name: Windows Native Contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pi-component-paths-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lib:
    name: Focused Pi component paths (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust 1.99.1 for the native runner
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-release-v1
          key: ${{ matrix.target }}-opensource
          cache-on-failure: true
      - name: Isolate test HOME while preserving the build toolchain
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Compile the complete native unit library without packaging
        id: lib_compile
        run: |
          set -euo pipefail
          cargo test --locked -p loongsuite-pilot --lib --no-run 2>&1 | tee "$RUNNER_TEMP/pilot-windows-lib-compile.log"
      - name: Execute the three affected exact contracts independently
        if: ${{ !cancelled() && steps.lib_compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pilot-windows-pi-focused.log"
          : > "$log"
          tests=(
            deployment::deployment_manager::history_contract_tests::manager_l606_l675_stale_recorded_pi_path_does_not_silently_adopt_another_home
            deployment::plugin_assets::pi_relocation_recovery_tests::interrupted_pi_state_last_transaction_recovers_before_fresh_manager_load_and_retry
            local_workers::deployment_isolation_history_contract_tests::isolation_l41_six_real_native_corpora_preserve_every_launching_home_legacy_byte_mode_and_mtime
          )
          failed=0
          for case in "${tests[@]}"; do
            printf '\n::group::exact %s\n' "$case" | tee -a "$log"
            registry="$RUNNER_TEMP/pilot-focused-registry.txt"
            cargo test --locked -p loongsuite-pilot --lib "$case" -- --exact --list --color never --test-threads=1 2>&1 | tee "$registry" | tee -a "$log"
            python -c 'import pathlib,sys; cases=[line for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.endswith(": test")]; assert cases==[sys.argv[2]+": test"], cases' "$registry" "$case"
            set +e
            cargo test --locked -p loongsuite-pilot --lib "$case" -- --exact --nocapture --test-threads=1 2>&1 | tee -a "$log"
            case_status=$?
            set -e
            printf 'exact_case_exit=%s case=%s\n::endgroup::\n' "$case_status" "$case" | tee -a "$log"
            if [ "$case_status" -ne 0 ]; then
              printf '::error title=Pi exact regression::%s failed with status %s\n' "$case" "$case_status"
              failed=1
            fi
          done
          exit "$failed"
      - name: Save compile and exact regression logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-components-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pilot-windows-lib-compile.log
            ${{ runner.temp }}/pilot-windows-pi-focused.log
