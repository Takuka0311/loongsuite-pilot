name: Windows multimodal fixture after diagnostics

on:
  workflow_dispatch:
  push:
    branches: [loongsuite-pilot-rust]
    paths: [.github/workflows/windows-native-contracts.yml]

permissions:
  contents: read

concurrency:
  group: windows-native-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  native:
    name: Multimodal after (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: lib, os: windows-2022, target: x86_64-pc-windows-msvc}
          - {suite: lib, os: windows-11-arm, target: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust 1.99.1 for the native runner
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-release-v1
          key: ${{ matrix.target }}-opensource
          cache-on-failure: true
      - name: Isolate test HOME while preserving the build toolchain
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Run bounded multimodal contracts without packaging
        timeout-minutes: 30
        if: matrix.suite == 'lib'
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/pilot-unblocked-tests.log"
          printf 'base=e15900948906f5116be301c409b5a62bba98509d\nsuite=multimodal-after\ndashboard_patch=38b9d607e3880c8f0e5b27b00602176353ee84c307ce5d9677dda6a6cdcf1c58\n' > "$log"
          set +e
          result=0
          for filter in multimodal::processor::migration_lifecycle_tests::a_path_read_cannot_enqueue_a_relative_uri_while_the_storage_origin_is_being_relearned multimodal::processor::migration_contract_tests::real_path_cache_revalidates_missing_files_and_changed_size_and_mtime multimodal::; do
            printf '\nfilter=%s\n' "$filter" | tee -a "$log"
            cargo test --locked -p loongsuite-pilot --lib "$filter" -- --nocapture 2>&1 | tee -a "$log"
            test_result="${PIPESTATUS[0]}"
            printf 'filter_exit=%s\n' "$test_result" | tee -a "$log"
            if [ "$test_result" -ne 0 ]; then result="$test_result"; fi
          done
          set -e
          printf 'cargo_exit=%s\n' "$result" | tee -a "$log"
          exit "$result"
      - name: Upload complete harness results even on test failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multimodal-after-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/pilot-unblocked-tests.log
          retention-days: 3
          if-no-files-found: warn
