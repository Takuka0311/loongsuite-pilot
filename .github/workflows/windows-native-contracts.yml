name: Windows Native Contracts
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  native:
    name: Trace linker original workload (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install locked native Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: rust-release-v1
          key: ${{ matrix.target }}-opensource
          cache-on-failure: true
      - name: Isolate test HOME
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Verify the original isolated scaling and cache workload
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/pilot-trace-linker-original-workload.log"
          : > "$log"
          failures=0
          for filter in core::upstream_link::trace_linker::load_history_tests::original_interleaving_scaling_and_cache_workloads_preserve_all_sizes_and_guards; do
            printf 'command: cargo test --lib %s\n' "$filter" >> "$log"
            if cargo test --locked -p loongsuite-pilot --lib "$filter" -- --exact --test-threads=1 --nocapture 2>&1 | tee -a "$log"; then :; else failures=1; fi
          done
          test "$failures" -eq 0
      - name: Save native group results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-linker-original-workload-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/pilot-trace-linker-original-workload.log
          retention-days: 3
          if-no-files-found: warn
