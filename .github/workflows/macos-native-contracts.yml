name: macOS Native CLI isolated UID diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-shortcut-cli-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTUP_TOOLCHAIN: 1.99.1-aarch64-apple-darwin
  CARGO_BUILD_JOBS: 1
jobs:
  shortcut:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: rust-native-macos-v1
          key: aarch64-apple-darwin
          cache-on-failure: true
      - name: Compile only the actual Native CLI and this integration target
        run: |
          set -euo pipefail
          cargo build -p loongsuite-pilot --all-features --locked --bin loongsuite-pilot
          cargo test -p loongsuite-pilot --all-features --locked --test dashboard_shortcut_cli_macos --no-run --message-format=json > "$RUNNER_TEMP/shortcut-build.jsonl"
      - name: Original whole CLI contract in an ephemeral hidden UID
        run: |
          set -euo pipefail
          export PILOT_SHORTCUT_CLI_CI_STATE="$RUNNER_TEMP/pilot-shortcut-cli-owned-user.json"
          trap 'sudo -n /usr/bin/env GITHUB_ACTIONS=true /usr/bin/python3 tests/host/macos/shortcut_cli_owned_user.py --cleanup-state "$PILOT_SHORTCUT_CLI_CI_STATE"' EXIT
          test_binary="$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="dashboard_shortcut_cli_macos" and r.get("executable")]; assert len(paths)==1; print(paths[0])' "$RUNNER_TEMP/shortcut-build.jsonl")"
          sudo -n /usr/bin/env GITHUB_ACTIONS=true PILOT_SHORTCUT_CLI_RUNNER_USER="$(id -un)" PILOT_SHORTCUT_CLI_CI_STATE="$PILOT_SHORTCUT_CLI_CI_STATE" "$test_binary" --exact physical_macos_whole_shipped_cli_install_status_uninstall_without_node_or_build_output --nocapture
      - name: Cleanup only the recorded fixture UID and root
        if: always()
        run: sudo -n /usr/bin/env GITHUB_ACTIONS=true /usr/bin/python3 tests/host/macos/shortcut_cli_owned_user.py --cleanup-state "$RUNNER_TEMP/pilot-shortcut-cli-owned-user.json"
