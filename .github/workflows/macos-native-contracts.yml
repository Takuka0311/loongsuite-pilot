name: macOS Native Contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-startup-isolated:
    name: Intel original cleanup entry budgets (two leaves x3)
    runs-on: macos-26-intel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-apple-darwin
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install original pinned native Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-apple-darwin
          sysctl -n hw.ncpu hw.memsize
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: rust-native-macos-v1
          key: x86_64-apple-darwin
          cache-on-failure: true
      - name: Isolate HOME while retaining toolchain paths
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Compile only original installer target without packaging
        id: compile
        run: cargo test --locked -p loongsuite-pilot --all-features --test installer_native --no-run
      - name: Exact original cleanup entries three isolated rounds
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -uo pipefail
          failures=0
          for round in 1 2 3; do
            for leaf in \
              installer_uninstall_extra_history::cleanup_l561_legacy_codex_sh_and_mjs_mixed_handlers_keep_foreign_groups_and_all_otel_assets \
              installer_uninstall_extra_history::cleanup_l753_l766_shipped_hermes_disable_runs_before_recorded_target_removal_and_refuses_foreign_markers; do
              echo "ROUND=$round EXACT=$leaf"
              count=$(cargo test --locked -p loongsuite-pilot --all-features --test installer_native "$leaf" -- --exact --list | grep -c ': test$')
              test "$count" -eq 1 || exit 2
              cargo test --locked -p loongsuite-pilot --all-features --test installer_native "$leaf" -- --exact --test-threads=1 --nocapture 2>&1 | tee -a "$RUNNER_TEMP/pilot-intel-startup-isolated.log"
              code=${PIPESTATUS[0]}
              echo "ROUND=$round EXACT=$leaf EXIT=$code" | tee -a "$RUNNER_TEMP/pilot-intel-startup-isolated.log"
              if test "$code" -ne 0; then failures=1; fi
            done
          done
          exit "$failures"
      - name: Save exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-original-cleanup-x3-${{ github.sha }}
          path: ${{ runner.temp }}/pilot-intel-startup-isolated.log
          if-no-files-found: warn
          retention-days: 3
